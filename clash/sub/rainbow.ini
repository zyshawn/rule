[custom]
;===============================================================
; Subconverter 自定义配置
; 规则来源：SukkaW Ruleset + ACL4SSR + blackmatrix7 + chinnsenn
;
; 规则顺序原则：
;   1. 直连白名单 > 广告拦截 > 功能分流 > 国内直连 > 兜底
;   2. 同一组内：non_ip / domainset 必须全部在 ip 之前
;      （避免 non_ip 阶段触发不必要的 DNS 解析）
;===============================================================

;---------------------------------------------------------------
; 1. 直连白名单（最高优先级，避免误代理）
;---------------------------------------------------------------
ruleset=🎯 全球直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Direct/Direct.list

;---------------------------------------------------------------
; 2. 广告拦截 / 隐私保护（SukkaW 全量）
;    顺序：reject-drop > domainset > non_ip reject > reject-no-drop > ip reject
;---------------------------------------------------------------
ruleset=🛑 广告拦截,https://ruleset.skk.moe/Clash/non_ip/reject-drop.txt
ruleset=🛑 广告拦截,https://ruleset.skk.moe/Clash/domainset/reject.txt
ruleset=🛑 广告拦截,https://ruleset.skk.moe/Clash/domainset/reject_extra.txt
ruleset=🛑 广告拦截,https://ruleset.skk.moe/Clash/non_ip/reject.txt
ruleset=🛑 广告拦截,https://ruleset.skk.moe/Clash/non_ip/reject-no-drop.txt
ruleset=🛑 广告拦截,https://ruleset.skk.moe/Clash/ip/reject.txt

;---------------------------------------------------------------
; 3. 隐私防护 / 应用净化（ACL4SSR）
;---------------------------------------------------------------
ruleset=🛡️ 隐私防护,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanEasyPrivacy.list
ruleset=🍃 应用净化,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list

;---------------------------------------------------------------
; 4. Google FCM（国内可直连的推送服务，优先直连）
;---------------------------------------------------------------
ruleset=📢 谷歌FCM,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/GoogleFCM.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list

;---------------------------------------------------------------
; 5. 微软服务（SukkaW，non_ip 在前）
;    Microsoft CDN（国内备案域名）建议直连，OneDrive 单独分组
;---------------------------------------------------------------
ruleset=Ⓜ️ 微软云盘,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OneDrive/OneDrive.list
ruleset=Ⓜ️ 微软服务,https://ruleset.skk.moe/Clash/non_ip/microsoft_cdn.txt
ruleset=Ⓜ️ 微软服务,https://ruleset.skk.moe/Clash/non_ip/microsoft.txt

;---------------------------------------------------------------
; 6. 苹果服务（SukkaW）
;    Apple CDN（国内备案域名）直连，Apple CN 直连，其余走策略
;---------------------------------------------------------------
ruleset=🍎 苹果服务,https://ruleset.skk.moe/Clash/domainset/apple_cdn.txt
ruleset=🍎 苹果服务,https://ruleset.skk.moe/Clash/non_ip/apple_cn.txt
ruleset=🍎 苹果服务,https://ruleset.skk.moe/Clash/non_ip/apple_services.txt

;---------------------------------------------------------------
; 7. Telegram（SukkaW，合并成单一组，non_ip 在前）
;---------------------------------------------------------------
ruleset=📲 Telegram,https://ruleset.skk.moe/Clash/non_ip/telegram.txt
ruleset=📲 Telegram,https://ruleset.skk.moe/Clash/ip/telegram.txt

;---------------------------------------------------------------
; 8. AI 服务（SukkaW，包含 OpenAI/Claude/Gemini/Perplexity 等）
;---------------------------------------------------------------
ruleset=🤖 AI,https://ruleset.skk.moe/Clash/non_ip/ai.txt

;---------------------------------------------------------------
; 9. DeepL（单独分组，可按需直连或代理）
;---------------------------------------------------------------
ruleset=🤖 DeepL,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/DeepL/DeepL.list

;---------------------------------------------------------------
; 10. Google 搜索 / YouTube
